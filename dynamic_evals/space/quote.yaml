scenarios:

  - scenario_id: quote_request_create
    intent: request_quote
    domain: quote
    capability: interpret_request_and_create_quote
    interaction_mode: email
    customer_turns:
      min: 1
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: request_quote_initial
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a new sales quote for one or more products.
      The system must correctly interpret the requested item(s),
      including quantity, unit of measure, and optional identifying details such as
      variant, attributes, item reference, or unit expressions embedded in natural language.
      The system must also support large multi-line quote requests, repeated item lines,
      mixed item reference styles, and large quantities. If enough information is available,
      the system creates a sales quote directly. Otherwise, the system may ask for clarification
      before the quote can be created.

    generation_constraints:

      clarification_gap_scope: initial_turn
      clarification_gap_types:
        - missing_variant
        - missing_attribute_value
        - missing_quantity
        - missing_uom
        - partial_product_name
        - missing_bundle_option
        - missing_exact_item_mapping
        - ambiguous_color_split
        - context_dependent_reference

      intervention_manifest_scope: initial_turn
      intervention_trigger_types:
        - unresolved_unknown_item
        - no_catalog_match_for_all_requested_items
        - unsafe_or_unprocessable_initial_quote_request

      number_of_requested_items:
        min: 1
        max: 20

      item_reference_style:
        - product_name
        - item_number
        - item_number_only_reference
        - description_with_attributes
        - description_with_implicit_attributes
        - description_with_variant
        - description_with_implicit_variant
        - mixed_description_and_item_number

      item_resolution_patterns:
        - exact_item_reference     
        - item_number_based_resolution
        - mixed_name_and_item_number_resolution
        - attribute_based_item_disambiguation
        - same_base_description_with_different_attributes
        - combined_description_and_attributes_identify_unique_item
        - variant_based_item_disambiguation
        - same_base_item_with_different_variants

      item_details:
        - quantity_specified
        - uom_specified
        - variant_specified
        - attribute_values_specified
        - variant_values_may_be_explicit_or_implicit
        - variant_may_be_optional

      variant_resolution_patterns:
        - explicit_variant_selection
        - implicit_variant_in_description
        - semantic_variant_inference
        - optional_variant_not_specified
        - same_base_item_with_different_variants

      variant_reference_style:
        - explicit_variant_code
        - explicit_variant_label
        - natural_language_variant_description
        - synonym_or_semantic_variant_reference
        - omitted_variant_for_optional_variant_items

      uom_resolution_patterns:
        - explicit_unit_of_measure
        - implicit_unit_of_measure_in_description
        - singular_and_plural_uom_forms
        - uom_synonym_normalization
        - mixed_base_and_alternate_uoms
        - repeated_item_with_different_uoms

      uom_reference_style:
        - standard_uom_code
        - natural_language_uom
        - abbreviated_uom
        - synonym_uom

      request_patterns:
        - direct_quote_request
        - quote_request_requiring_clarification
        - large_multi_item_quote_request
        - repeated_item_lines_in_single_request
        - mixed_item_reference_styles_in_single_request
        - verbose_or_terse_multi_line_request

      quantity_parsing_patterns:
        - ascending_or_non_uniform_quantities
        - large_integer_quantities
        - repeated_item_with_different_quantities
        - quantity_must_be_bound_to_the_correct_line_item

      delivery_requirement_patterns:
        - requested_delivery_date_specified
        - requested_delivery_date_expressed_in_natural_language

      line_parsing_behavior:
        - preserve_each_requested_line_as_a_separate_quote_line
        - repeated_items_may_appear_multiple_times
        - repeated_items_should_not_be_merged_unless_explicitly_required
        - quantities_must_be_parsed_per_line
        - item_reference_may_mix_description_and_item_number

      clarification_behavior:
        - clarification_may_be_required_before_quote_creation
        - customer_follow_up_may_supply_missing_quote_details

      follow_up_grounding:
        - customer_follow_up_should_be_grounded_in_the_previous_soa_clarification
        - customer_follow_up_should_supply_missing_details_requested_by_soa
        - customer_follow_up_should_preserve_thread_context

    variants:
      - outcome_id: quote_created
        description: |
          The request contains enough valid information and the system creates a quote.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: false

      - outcome_id: clarification_required
        description: |
          The request is ambiguous or incomplete, so the system asks the customer for clarification.
        expected:
          allowQuote: false
          clarification_email: true
          quotes: false
          sales_orders: false
          userIntervention: false

      - outcome_id: intervention_required
        description: |
          The request cannot proceed safely in the initial quote-creation step and requires intervention.
        expected:
          allowQuote: false
          quotes: false
          sales_orders: false
          userIntervention: true

  - scenario_id: quote_update_requested
    intent: update_quote
    domain: quote
    capability: update_existing_quote
    interaction_mode: email
    customer_turns:
      min: 2
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: quote_create_then_update
    prerequisites:
      requires_existing_quote: true
      requires_existing_order: false

    goal: |
      The customer first requests a sales quote for one or more items.
      After the quote has been created, the customer sends a follow-up email
      requesting an update to that existing quote, such as changing quantity,
      replacing an item, adding a line, removing a line, or replacing the
      requested item set. The system must identify the existing quote, apply
      the requested changes, and generate an updated quote.

    generation_constraints:

      clarification_gap_scope: follow_up_turn
      clarification_gap_types:
        - ambiguous_line_reference
        - missing_update_target
        - missing_new_value
        - missing_replacement_item
        - missing_new_quantity
        - ambiguous_add_remove_instruction

      initial_request:
        number_of_requested_items:
          min: 1
          max: 5

      follow_up_grounding:
        - turn_2_customer_reply_must_be_grounded_in_the_quote_created_by_soa_in_turn_1
        - turn_2_customer_reply_must_request_changes_to_the_existing_quote_not_start_a_new_quote_request
        - turn_2_customer_reply_should_preserve_thread_context

      update_actions:
        - change_quantity
        - replace_item
        - add_item
        - remove_item
        - replace_entire_requested_set
        - mixed_line_updates

      response_behavior:
        - identify_existing_quote_from_thread_context
        - apply_requested_quote_updates
        - return_updated_quote
        - preserve_unchanged_lines_when_applicable

    variants:
      - outcome_id: quote_updated
        description: |
          The system successfully identifies the existing quote and applies the requested update.
        expected:
          allowQuote: true
          quotes_updated: true
          sales_orders: false
          userIntervention: false

      - outcome_id: clarification_required
        description: |
          The system cannot safely apply the requested update because the update request is ambiguous.
        expected:
          allowQuote: false
          clarification_email: true
          quotes_updated: false
          sales_orders: false
          userIntervention: false

  - scenario_id: quote_review_update
    intent: update_quote
    domain: quote
    capability: update_quote_in_review
    interaction_mode: multi_turn_email
    workflow_template: quote_review_then_update
    prerequisites:
      requires_existing_quote: true
      requires_existing_order: false

    goal: |
      The customer requests updates to item quantity, unit of measure,
      or similar editable details during the review step of the quote.
      The system must apply the reviewed updates before generating
      the final quote.

    generation_constraints:
      clarification_gap_scope: follow_up_turn
      clarification_gap_types:
        - ambiguous_line_reference
        - missing_new_quantity
        - missing_new_uom
        - missing_edit_target
        - ambiguous_edit_instruction

    variants:
      - outcome_id: quote_updated
        description: |
          The reviewed quote is updated successfully before finalization.
        expected:
          allowQuote: true
          quotes_updated: true
          userIntervention: false

      - outcome_id: clarification_required
        description: |
          The requested review update is ambiguous and requires clarification.
        expected:
          allowQuote: false
          clarification_email: true
          quotes_updated: false
          userIntervention: false

  - scenario_id: quote_rejected
    intent: quote_lifecycle_decision
    domain: quote
    capability: quote_lifecycle_termination
    interaction_mode: email
    customer_turns:
      min: 2
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: quote_create_then_not_approved
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer first requests a quote and receives it.
      In a later email, the customer indicates that the quote is not approved,
      should not proceed, should be held for later, or is otherwise not accepted
      for conversion into a sales order. The system must recognize that the quote
      lifecycle should not continue to sales order creation and must keep the quote
      without creating an order.

    generation_constraints:
      request_flow:
        - turn_1_quote_request
        - turn_2_quote_not_approved

      follow_up_grounding:
        - turn_2_customer_reply_must_be_grounded_in_the_quote_created_by_soa_in_turn_1
        - turn_2_customer_reply_should_reject_decline_or_defer_the_existing_quote
        - turn_2_customer_reply_should_preserve_thread_context

      rejection_patterns:
        - explicit_rejection
        - too_expensive_or_not_acceptable
        - not_confirmed_do_not_proceed
        - hold_for_later_or_pending_review

      response_behavior:
        - create_quote_in_turn_1
        - do_not_create_sales_order_after_non_approval
        - preserve_existing_quote_state

    variants:
      - outcome_id: quote_rejected
        description: |
          The customer does not approve the quote, so the system keeps the quote
          unchanged and does not create a sales order.
        expected:
          allowQuote: false
          quotes: true
          sales_orders: false
          userIntervention: false

  - scenario_id: quote_approved_to_order
    intent: quote_lifecycle_decision
    domain: quote
    capability: quote_to_order_conversion
    interaction_mode: email
    customer_turns:
      min: 2
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: quote_create_then_approve_to_order
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer first requests a sales quote for one or more items.
      After the quote is created and sent, the customer confirms or approves
      that quote in a follow-up email. The system must recognize the approval,
      associate it with the previously created quote, and convert the quote
      into a sales order.

    generation_constraints:
      request_flow:
        - turn_1_quote_request
        - turn_2_quote_approval

      follow_up_grounding:
        - turn_2_customer_reply_must_be_grounded_in_the_quote_created_by_soa_in_turn_1
        - turn_2_customer_reply_should_confirm_or_approve_the_existing_quote
        - turn_2_customer_reply_should_preserve_thread_context

      response_behavior:
        - create_quote_in_turn_1
        - create_sales_order_after_customer_approval
        - preserve_quote_lines_when_creating_order

    variants:
      - outcome_id: order_created
        description: |
          The customer approves the previously created quote and the system
          creates a sales order from it.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: false

  - scenario_id: quote_to_order_lifecycle
    intent: lifecycle_management
    domain: quote
    capability: lifecycle_management_with_order_immutability
    interaction_mode: email
    customer_turns:
      min: 3
      max: 4
    conversation_mode: runtime_grounded
    workflow_template: quote_create_update_approve_then_block_order_update
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false
    per_turn_expected_data: true

    goal: |
      The customer requests a quote, may update the quote in a follow-up email,
      later confirms the quote to create a sales order, and then sends another
      follow-up request to modify the finalized sales order. The system must apply
      supported updates while the request is still in the quote stage, but must
      enforce order immutability after sales order creation and block any requested
      updates to the finalized order.

    generation_constraints:

      intervention_manifest_scope: follow_up_turn
      intervention_trigger_types:
        - post_order_update_not_supported
        - finalized_order_immutability_enforced
        - blocked_existing_order_modification

      request_flow:
        - turn_1_quote_request
        - optional_turn_2_quote_update
        - quote_approval_to_order_creation
        - post_order_update_request

      follow_up_grounding:
        - quote_update_turn_must_be_grounded_in_the_quote_created_by_soa_in_the_previous_turn
        - quote_update_turn_must_modify_existing_quote_content_not_start_a_new_quote_request
        - order_approval_turn_must_be_grounded_in_the_latest_quote_state_created_or_updated_by_soa
        - post_order_update_turn_must_be_grounded_in_the_sales_order_created_by_soa
        - post_order_update_turn_must_request_changes_to_the_existing_order_not_start_a_new_order
        - all_follow_up_messages_should_preserve_thread_context_and_previously_confirmed_items

      quote_update_actions:
        - change_quantity
        - replace_item
        - add_item
        - remove_item

      post_order_update_actions:
        - change_quantity
        - replace_item
        - add_item
        - remove_item

      response_behavior:
        - create_quote_in_initial_turn
        - apply_supported_quote_update_before_order_creation
        - create_sales_order_after_customer_confirmation
        - reject_or_block_post_order_edit_request
        - preserve_existing_sales_order_state
        - request_user_intervention_when_order_edit_is_not_supported

    variants:
      - outcome_id: order_update_blocked
        description: |
          The system allows supported updates while the request is still a quote,
          creates the sales order after customer confirmation, and blocks any
          invalid update request to the finalized sales order while keeping the
          existing order unchanged.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: true

  - scenario_id: quote_request_capable_to_promise_option_selection
    intent: request_quote
    domain: quote
    capability: availability_and_shipment_evaluation
    interaction_mode: email
    customer_turns:
      min: 2
      max: 3
    conversation_mode: runtime_grounded
    workflow_template: request_quote_then_confirm_shipment_option
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a quote for an item or product category that may not
      be immediately available, or may match multiple valid item or shipment options.
      The system should evaluate availability and earliest shipment feasibility,
      present suitable options to the customer, and create the quote only after the
      customer confirms which item or shipment option to proceed with.

    generation_constraints:
      clarification_gap_scope: initial_turn
      clarification_gap_types:
        - ambiguous_item_selection
        - ambiguous_shipment_option
        - ambiguous_availability_preference
        - multiple_candidate_item_match
        - missing_requested_date_for_option_selection

      request_patterns:
        - ambiguous_item_without_requested_date
        - multiple_candidate_items
        - unavailable_today_but_available_later
        - multiple_available_items_same_family
        - available_today_options_only

      fulfillment_context:
        - availability_must_be_evaluated
        - candidate_items_may_have_different_available_dates
        - only_currently_available_items_may_be_offered_in_initial_response_when_appropriate
        - quote_is_created_only_after_customer_selection

      follow_up_grounding:
        - customer_follow_up_must_be_grounded_in_items_presented_by_soa_in_turn_1
        - customer_follow_up_must_select_from_previously_offered_options
        - customer_follow_up_may_split_the_requested_quantity_across_multiple_offered_items
        - customer_follow_up_should_preserve_thread_context

      response_behavior:
        - no_quote_created_in_first_response
        - suggest_matching_items_or_shipment_options
        - include_availability_or_earliest_shipment_dates_when_relevant
        - create_quote_after_customer_selection
        - no_sales_order_creation_before_quote_confirmation

    variants:
      - outcome_id: clarification_required
        description: |
          The system asks the customer to confirm an item, shipment, or availability option
          before creating the quote.
        expected:
          allowQuote: false
          clarification_email: true
          quotes: false
          sales_orders: false
          userIntervention: false

      - outcome_id: quote_created
        description: |
          After the customer confirms the preferred item or availability option,
          the system creates the quote.
        expected:
          allowQuote: true
          clarification_email: false
          quotes: true
          sales_orders: false
          userIntervention: false

      - outcome_id: sales_order_created
        description: |
          After the quote is created and later confirmed by the customer,
          the system creates a sales order.
        expected:
          allowQuote: true
          clarification_email: false
          quotes: true
          sales_orders: true
          userIntervention: false

  - scenario_id: quote_request_capable_to_promise_direct_quote
    intent: request_quote
    domain: quote
    capability: availability_and_shipment_evaluation
    interaction_mode: email
    customer_turns:
      min: 1
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: request_quote_with_requested_shipment_date
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a quote and provides a requested shipment timing
      that is sufficiently clear for capable-to-promise evaluation.
      If the requested quantity can be fulfilled by the requested date,
      the system should create the quote directly in the initial response
      without requiring an additional shipment-option confirmation step.

    generation_constraints:
      request_patterns:
        - explicit_requested_date
        - requested_date_allows_fulfillment
        - direct_quote_possible
      fulfillment_context:
        - capable_to_promise_enabled
        - shipment_date_must_be_derived_from_customer_request
        - quote_can_be_created_in_first_response
      response_behavior:
        - create_quote_immediately
        - attach_quote_or clearly_state_quote_created
        - no_pre_quote_clarification_step
        - allow_order_creation_after_customer_confirmation

    variants:
      - outcome_id: quote_created
        description: |
          The requested date is feasible, so the system directly creates
          a quote in the first response.
        expected:
          allowQuote: true
          clarification_email: false
          quotes: true
          sales_orders: false
          userIntervention: false

      - outcome_id: sales_order_created
        description: |
          After the customer confirms the directly created quote,
          the system creates a sales order.
        expected:
          allowQuote: true
          clarification_email: false
          quotes: true
          sales_orders: true
          userIntervention: false

  - scenario_id: quote_update_capable_to_promise
    intent: revise_quote
    domain: quote
    capability: availability_and_shipment_re_evaluation
    interaction_mode: email
    customer_turns:
      min: 3
      max: 4
    conversation_mode: runtime_grounded
    workflow_template: revise_quote_after_capable_to_promise_check
    prerequisites:
      requires_existing_quote: true
      requires_existing_order: false

    goal: |
      The customer first requests a quote and the system creates it based on the
      original request. After the quote has been created, the customer asks for a
      change such as increasing quantity or changing fulfillment expectations.
      The system must re-evaluate availability and shipment feasibility using
      capable-to-promise logic, update the quote if possible, and either proceed
      directly or request confirmation when the revised shipment timing differs
      from the original expectation.

    generation_constraints:

      clarification_gap_scope: follow_up_turn
      clarification_gap_types:
        - missing_revised_shipment_preference
        - ambiguous_quantity_change
        - ambiguous_fulfillment_preference
        - missing_confirmation_of_new_shipment_date

      request_patterns:
        - quantity_increase_after_quote_creation
        - post_quote_change_request
        - revised_quantity_may_affect_shipment_date
      fulfillment_context:
        - capable_to_promise_enabled
        - existing_quote_must_be_updated
        - revised_availability_or_shipment_date_must_be_recomputed
      response_behavior:
        - update_existing_quote_when_possible
        - if_new_shipment_date_needed_then_request_confirmation
        - create_sales_order_only_after_final_customer_confirmation

    variants:
      - outcome_id: quote_updated
        description: |
          The revised customer request can be accommodated and the existing quote
          is updated accordingly.
        expected:
          allowQuote: true
          clarification_email: false
          quotes: true
          sales_orders: false
          userIntervention: false

      - outcome_id: clarification_required
        description: |
          The revised request changes the shipment feasibility, so the system
          asks the customer to confirm the new shipment date or fulfillment option
          before finalizing the revised quote or creating the order.
        expected:
          allowQuote: true
          clarification_email: true
          quotes: true
          sales_orders: false
          userIntervention: false

      - outcome_id: sales_order_created
        description: |
          After the customer confirms the revised quote or revised shipment option,
          the system creates a sales order.
        expected:
          allowQuote: true
          clarification_email: false
          quotes: true
          sales_orders: true
          userIntervention: false

  - scenario_id: quote_request_with_alternate_shipping
    intent: request_quote
    domain: quote
    capability: alternate_shipping_address_parsing
    interaction_mode: email
    customer_turns:
      min: 1
      max: 1
    workflow_template: request_quote_with_shipping_override
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a quote and specifies a shipping address that differs
      from the default sell-to address. The system must determine whether the requested
      shipping destination matches an existing alternate shipping address in the system
      or represents a new custom shipping address, and then apply the correct ship-to
      address when creating the quote.

    generation_constraints:

      clarification_gap_scope: initial_turn
      clarification_gap_types:
        - incomplete_shipping_address
        - ambiguous_shipping_location_reference
        - missing_address_component
        - unclear_alternate_ship_to_target

      request_patterns:
        - quote_request_with_explicit_shipping_address
        - quote_request_with_location_based_shipping_reference

      shipping_override_patterns:
        - full_address_matches_existing_alternate_shipping_address
        - full_address_creates_custom_shipping_address
        - natural_language_reference_to_saved_alternate_shipping_address

      sender_context:
        - request_from_customer
        - request_from_contact

      shipping_address_resolution:
        - alternate_shipping_address_match_by_full_address
        - alternate_shipping_address_match_by_location_reference
        - custom_shipping_address_when_no_saved_match_exists

      response_behavior:
        - create_quote_with_shipping_override
        - ship_to_address_must_reflect_resolved_override
        - default_sell_to_address_must_not_be_used_when_valid_override_is_present

    variants:
      - outcome_id: quote_created_with_alternate_shipping
        description: |
          The requested shipping destination matches an existing alternate shipping
          address, so the quote is created using that alternate ship-to address.
        expected:
          allowQuote: true
          attachments: true
          quotes: true
          sales_orders: false
          clarification_email: false
          userIntervention: false

      - outcome_id: quote_created_with_custom_shipping
        description: |
          The requested shipping destination does not match an existing alternate
          shipping address, so the quote is created using a custom ship-to address
          parsed from the email.
        expected:
          allowQuote: true
          attachments: true
          quotes: true
          sales_orders: false
          clarification_email: false
          userIntervention: false

      - outcome_id: clarification_required
        description: |
          The shipping address is incomplete or ambiguous and must be clarified
          before the quote can be created safely.
        expected:
          allowQuote: false
          attachments: false
          clarification_email: true
          quotes: false
          sales_orders: false
          userIntervention: false

  - scenario_id: quote_request_contact_resolution
    intent: request_quote
    domain: quote
    capability: resolve_customer_identity
    interaction_mode: email
    customer_turns:
      min: 1
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: request_quote_with_contact_resolution
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a quote, but customer identity cannot be determined
      solely from a simple contact-name match. The system must resolve the correct
      customer using available identity signals such as sender email address,
      contact records, and signature or company information in the email body
      before creating the quote.

    generation_constraints:
    
      intervention_manifest_scope: initial_turn
      intervention_trigger_types:
        - ambiguous_customer_identity
        - unresolved_contact_to_customer_mapping
        - conflicting_identity_signals

      identity_resolution_patterns:
        - same_contact_name_across_multiple_customers
        - sender_email_disambiguates_customer
