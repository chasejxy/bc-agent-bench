      and, depending on configuration, may request quote review and quote email review.
      If quote sending is enabled and quote-to-order conversion is enabled, the customer
      later confirms the quote in a follow-up email and the system creates a sales order.
      Depending on configuration, the order step may also require order review.

    generation_constraints:
      configuration_flags:
