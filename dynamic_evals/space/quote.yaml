      response_behavior:
        - create_quote_in_first_turn
        - optional_quote_record_review
        - optional_quote_email_review
        - create_order_after_customer_confirmation
        - optional_order_record_review
        - order_email_review_or_send_step_present

    variants:
      - outcome_id: sales_order_created
        description: |
          The system creates the quote first and, after customer confirmation,
