  - scenario_id: quote_request_with_availability_intervention
    intent: request_quote
    domain: quote
    capability: resolve_item_availability_with_intervention
    interaction_mode: email
    customer_turns:
      min: 1
      max: 1
    workflow_template: request_quote_with_availability_intervention
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a quote for an item that is not currently available
      for quoting. The system must trigger an intervention. The quote may proceed
      only if the intervention actually fixes the item-availability issue, for
      example by applying a supported suggestion or by following additional user
      instructions that result in an updated available state.

    generation_constraints:
      request_patterns:
        - requested_item_initially_unavailable
        - known_customer_quote_request

      intervention_modes:
        - continue_without_fix
        - suggestion_item_available
        - additional_instruction_with_manual_fix

      intervention_grounding:
        source_of_truth: post_intervention_item_availability_state
        applies_to:
          - final_quote
          - final_email
        overwrite_rules:
          - quote_creation_allowed_only_if_item_availability_issue_is_fixed
          - continue_or_resume_without_fix_must_not_create_quote
          - suggestion_or_instruction_must_be_supported_by_actual_state_change
          - final_quote_and_email_must_reflect_post_intervention_state

      response_behavior:
        - trigger_intervention_when_item_is_unavailable
        - do_not_create_quote_if_availability_remains_unresolved
        - create_quote_after_intervention_resolves_availability

    variants:
      - outcome_id: intervention_unresolved
        description: |
          The requested item remains unavailable after intervention handling,
          so the system does not create the quote.
        expected:
          allowQuote: false
          quotes: false
          sales_orders: false
          userIntervention: true

      - outcome_id: quote_created_after_intervention_resolution
        description: |
          The intervention resolves the availability issue, so the system creates
          the quote using the post-intervention state.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: true

  - scenario_id: localized_inquiry_quote_order_lifecycle
    intent: lifecycle_management
    domain: quote
    capability: localized_item_translation_and_quote_lifecycle
    interaction_mode: email
    customer_turns:
      min: 3
      max: 3
    conversation_mode: runtime_grounded
    workflow_template: inquiry_availability_then_localized_quote_then_order
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer first inquires about item availability, then requests a quote,
      and finally confirms the quote to create an order. The system must localize
      item descriptions and email language according to the customer or contact
      language settings. If the language is the default English language, item
      descriptions remain untranslated. If a supported non-English language is set,
      the system must use translated item descriptions consistently across the
      availability response, quote response, and order response.

    generation_constraints:
      localization_context:
        - customer_or_contact_language_controls_output_language
        - default_english_keeps_base_item_descriptions
        - supported_non_english_languages_use_translated_item_descriptions
        - email_language_and_region_follow_customer_language
      request_flow:
        - turn_1_is_availability_inquiry
        - turn_2_is_quote_request_based_on_previous_reply
        - turn_3_is_order_confirmation
      follow_up_grounding:
        - customer_follow_up_must_reference_items_offered_in_previous_soa_reply
        - customer_follow_up_should_use_same_language_as_previous_exchange
        - quote_and_order_emails_must_preserve_localized_item_descriptions
      fulfillment_context:
        - requested_items_are_available
        - no_clarification_required
        - no_user_intervention_required

    variants:
      - outcome_id: default_language_lifecycle_completed
        description: |
          The customer language is English, so item descriptions remain in the base
          language and the inquiry, quote, and order lifecycle completes successfully.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: false
          localizedItems: false
          emailLocalized: true

      - outcome_id: translated_language_lifecycle_completed
        description: |
          The customer language is a supported non-English language, so translated
          item descriptions are used consistently in the inquiry response, quote,
          and order lifecycle.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: false
          localizedItems: true
          emailLocalized: true

  - scenario_id: quote_request_with_review_step_update
    intent: request_quote
    domain: quote
    capability: apply_review_step_updates_before_final_quote
    interaction_mode: email
    customer_turns:
      min: 1
      max: 1
    workflow_template: request_quote_with_review_step_update
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a sales quote, but before the final quote is generated,
      the request is adjusted during an internal review or discard step. The system
      must apply the reviewed updates, such as changing quantity, unit of measure,
      or interpreted line details, and ensure that the final quote and outgoing email
      reflect the updated values rather than the original customer wording.

    generation_constraints:
      request_patterns:
        - single_turn_quote_request
        - quote_request_requires_review_step_adjustment

      discard_step_behavior:
        - discard_step_may_be_triggered
        - reviewed_values_become_source_of_truth
        - original_requested_values_must_not_be_used_in_final_output

      review_step_updates:
        - change_quantity
        - change_unit_of_measure
        - normalize_requested_line_values
        - discard_original_interpreted_values

      review_grounding:
        source_of_truth: reviewed_values
        applies_to:
          - final_quote
          - final_email
        overwrite_rules:
          - reviewed_quantity_overrides_requested_quantity
          - reviewed_uom_overrides_requested_uom
          - reviewed_lines_override_initial_interpreted_lines
          - original_customer_request_values_must_not_override_reviewed_values

      response_behavior:
        - create_quote_after_review_step_update
        - final_quote_must_reflect_reviewed_values
        - final_email_must_reflect_reviewed_values
        - no_additional_customer_turn_required
        - no_user_intervention_required

    variants:
      - outcome_id: quote_created_with_review_step_update
        description: |
          The request is updated during the review or discard step and the final
          quote is created using the reviewed values. The outgoing email must also
          reflect the reviewed values rather than the original request.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: false

  - scenario_id: quote_request_unknown_customer_intervention_resolution
    intent: request_quote
    domain: quote
    capability: resolve_unknown_customer_after_intervention
    interaction_mode: email
