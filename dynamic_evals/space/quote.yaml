        expected:
          allowQuote: false
          quotes: false         
          attachments: false
          clarification_email: false
          sales_orders: false
          userIntervention: true

      - outcome_id: quote_created_after_intervention_resolution
        description: |
          The unknown-customer issue is resolved during intervention handling,
          so the system proceeds to create the quote.
        expected:
          allowQuote: true
          quotes: true       
          attachments: true
          clarification_email: false
          sales_orders: false
          userIntervention: true

  - scenario_id: quote_request_attribute_clarification
    intent: request_quote
    domain: quote
    capability: clarify_attribute_based_item_selection_before_quote
    interaction_mode: email
    customer_turns:
      min: 2
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: request_quote_with_attribute_clarification
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a quote for items whose exact identification depends on
      attributes such as color, material, or other distinguishing properties.
      If the initially requested attributes are missing, unavailable, ambiguous,
      or do not match the available catalog options, the system must first send a
      clarification response listing valid attribute-based options. The customer
      then clarifies the request based on the system response, and the system
      creates the quote using the correctly resolved items.

    generation_constraints:

      clarification_gap_scope: initial_turn
      clarification_gap_types:
        - missing_attribute_value
        - unavailable_attribute_value
        - ambiguous_attribute_combination
        - partial_attribute_description
        - base_description_without_required_attribute

      request_patterns:
        - quote_request_for_items_with_shared_base_description
        - same_description_but_different_attributes
        - requested_attributes_missing_or_unavailable
        - requested_attribute_combination_not_available
        - attribute_based_item_disambiguation_required

      item_reference_style:
        - base_description_only
        - description_with_partial_attributes
        - description_with_unavailable_attributes
        - description_with_explicit_attributes_after_clarification

      clarification_behavior:
        - first_turn_must_not_create_quote
        - system_must_list_available_attribute_based_options
        - clarification_response_may_list_available_colors_materials_or_item_variants     
        - clarification_response_may_explain_that_no_exact_attribute_match_exists
        - clarification_response_may_offer_available_alternative_attribute_options
        - quote_creation_happens_only_after_customer_clarification

      follow_up_grounding:
        - turn_2_customer_reply_must_be_grounded_in_the_attribute_options_presented_by_soa_in_turn_1
        - turn_2_customer_reply_must_select_from_previously_offered_attribute_based_options
        - turn_2_customer_reply_should_preserve_thread_context
        - turn_2_customer_reply_must_not_introduce_unoffered_attributes_unless_explicitly_allowed

      item_resolution_patterns:
        - attribute_based_item_disambiguation
        - same_base_description_with_different_attributes
        - combined_description_and_attributes_identify_unique_item

      response_behavior:
        - no_quote_created_in_first_response
        - clarification_email_lists_valid_attribute_options
        - create_quote_after_customer_clarification
        - final_quote_and_email_must_reflect_clarified_attributes

    variants:
      - outcome_id: clarification_required
        description: |
          The initial request does not identify the attribute-based items precisely
          enough, so the system sends a clarification response listing valid options.
        expected:
          allowQuote: false
          attachments: false
          quotes: false
          sales_orders: false
          userIntervention: false

      - outcome_id: quote_created
        description: |
          After the customer clarifies the requested attribute-based items using the
          options provided in the previous system response, the system creates the quote.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: false

  - scenario_id: direct_order_request
    intent: request_order
    domain: quote
    capability: process_direct_order_request
    interaction_mode: email
    customer_turns:
      min: 1
      max: 1
    workflow_template: direct_order_request
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer sends a direct order request rather than first requesting a quote.
