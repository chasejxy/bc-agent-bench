  - scenario_id: quote_request_with_unknown_item_handling
    intent: request_quote
    domain: quote
    capability: handle_quote_request_with_unknown_items
    interaction_mode: email
    customer_turns:
      min: 1
      max: 1
    workflow_template: request_quote_with_unknown_items
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      The customer requests a quote, but one or more requested items are not found
      in the system. If none of the requested items can be resolved, the system must
      request user intervention and must not create a quote. If some requested items
      are known but others are not found, the system should inform the customer that
      the unknown items are not carried, but should not create a quote until the
      request is clarified or corrected.

    generation_constraints:

      intervention_manifest_scope: initial_turn
      intervention_trigger_types:
        - no_catalog_match_for_all_requested_items
        - completely_unresolved_item_set

      request_patterns:
        - quote_request_for_unknown_item
        - quote_request_for_multiple_unknown_items
        - quote_request_with_mixed_known_and_unknown_items

      item_resolution_patterns:
        - no_catalog_match_for_requested_item
        - partial_catalog_match_for_quote_request

      response_behavior:
        - do_not_create_quote_when_requested_items_are_unresolved
        - explain_unavailable_or_unknown_requested_items
        - request_user_intervention_when_no_requested_items_can_be_resolved
        - no_attachments

    variants:
      - outcome_id: unknown_items_reported
        description: |
          Some requested items are not found in the system, while at least one
          requested item is known. The system informs the customer about the
          unavailable items and does not create a quote.
        expected:
          allowQuote: false
          attachments: false
          clarification_email: false
          quotes: false
          sales_orders: false
          userIntervention: false

      - outcome_id: intervention_required
        description: |
          None of the requested items can be resolved, so the system requests
          user intervention and does not create a quote.
        expected:
          allowQuote: false
          attachments: false
          clarification_email: false
          quotes: false
          sales_orders: false
          userIntervention: true

