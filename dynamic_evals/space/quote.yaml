        - suggestion_customer_added
        - customer_created_before_resume

      intervention_grounding:
        source_of_truth: post_intervention_customer_resolution_state
        applies_to:
          - final_quote
          - final_email
        overwrite_rules:
          - quote_creation_allowed_only_if_customer_resolution_issue_is_fixed
          - continue_or_resume_without_fix_must_not_create_quote
          - customer_creation_or_resolution_must_be_reflected_in_final_state

      response_behavior:
        - trigger_intervention_when_sender_is_unknown
        - do_not_create_quote_if_customer_is_still_unknown
        - create_quote_only_after_customer_is_resolved

    variants:
      - outcome_id: intervention_unresolved
        description: |
          The sender remains unresolved after intervention handling, so the system
