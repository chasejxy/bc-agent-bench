        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: false

      - outcome_id: quote_created_with_record_review
        description: |
          The system creates the quote and requests quote record review before proceeding.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: true

      - outcome_id: quote_created_with_email_review
        description: |
          The system creates the quote and requests review of the outgoing quote email.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: true

      - outcome_id: quote_created_with_record_and_email_review
        description: |
          The system creates the quote and requests both quote record review
