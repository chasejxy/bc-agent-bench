        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: false

      - outcome_id: sales_order_created_with_quote_review
        description: |
          The system requests quote review before the quote stage is completed,
          then creates the sales order after customer confirmation.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: true

      - outcome_id: sales_order_created_with_order_review
        description: |
          The system creates the order after customer confirmation and requests
          order review before finalizing the order step.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: true

  - scenario_id: quote_request_direct_order_pipeline_without_quote_send
