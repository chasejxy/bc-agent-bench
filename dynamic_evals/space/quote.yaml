  - scenario_id: quote_request_template_selection
    intent: request_quote
    domain: quote
    capability: customer_template_selection
    interaction_mode: email
    customer_turns:
      min: 1
      max: 2
    conversation_mode: runtime_grounded
    workflow_template: request_quote_with_template_selection
    prerequisites:
      requires_existing_quote: false
      requires_existing_order: false

    goal: |
      A contact or person requests a sales quote, but the system must first determine
      which customer template should be used to create the corresponding customer context.
      If exactly one suitable customer template is available, the system should select it
      automatically and create the quote. If multiple templates are possible, the system
      should request assistance to choose the correct template before proceeding.
      After the quote is created, a later approval email may convert the quote into a sales order.

    generation_constraints:

      intervention_manifest_scope: initial_turn
      intervention_trigger_types:
        - multiple_customer_templates_available
        - template_selection_not_resolvable_automatically

      sender_context:
        - sender_is_contact_or_person
        - no_existing_customer_required_at_start
      customer_template_resolution:
        - single_matching_template
        - multiple_matching_templates
      response_behavior:
        - auto_select_template_when_unique
        - request_intervention_when_multiple_templates_exist
        - create_quote_after_template_resolution
        - allow_sales_order_creation_after_follow_up_confirmation

    variants:
      - outcome_id: quote_created_with_intervention
        description: |
          Multiple customer templates are possible, so the system requires user
          assistance to select the correct template before creating the quote.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: true

      - outcome_id: quote_created
        description: |
          Exactly one suitable customer template is available, so the system
          automatically selects it and creates the quote.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: false
          userIntervention: false

      - outcome_id: sales_order_created
        description: |
          After the quote is created using the resolved customer template,
          the customer confirms it in a follow-up email and the system creates a sales order.
        expected:
          allowQuote: true
          quotes: true
          sales_orders: true
          userIntervention: false

  - scenario_id: quote_request_with_review_and_send_controls
